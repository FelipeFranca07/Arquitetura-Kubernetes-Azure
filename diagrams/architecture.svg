<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" role="img" aria-label="Tráfego público passa pelo NSG e pelo Azure Load Balancer até a VNet, que contém a subnet pública e a subnet privada. O AKS roda na subnet privada e acessa Azure SQL, Blob Storage e Cosmos DB. Separadamente, a VNet tem uma rota de peering com o hub, levando a outras VNets ou ao ambiente on-premises.">
  <rect x="0" y="0" width="920" height="660" fill="#0B3855"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BFE6F5"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:#F0A93B"/>
    </marker>
  </defs>

  <rect x="380" y="20" width="160" height="50" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="460" y="50" text-anchor="middle" font-size="13" fill="#BFE6F5">Internet</text>

  <line x1="460" y1="70" x2="460" y2="106" stroke="#BFE6F5" marker-end="url(#arrow)"/>
  <text x="472" y="92" font-size="11" fill="#BFE6F5" opacity="0.85">tráfego público</text>

  <rect x="330" y="108" width="260" height="54" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="460" y="131" text-anchor="middle" font-size="13" fill="#BFE6F5">NSG</text>
  <text x="460" y="148" text-anchor="middle" font-size="11" fill="#BFE6F5" opacity="0.75">Network Security Group</text>

  <line x1="460" y1="162" x2="460" y2="198" stroke="#BFE6F5" marker-end="url(#arrow)"/>

  <rect x="320" y="200" width="280" height="54" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="460" y="232" text-anchor="middle" font-size="13" fill="#BFE6F5">Azure Load Balancer</text>

  <line x1="460" y1="254" x2="460" y2="272" stroke="#BFE6F5"/>

  <rect x="60" y="272" width="620" height="210" rx="4" fill="none" stroke="#BFE6F5" stroke-dasharray="4 4" opacity="0.85"/>
  <text x="76" y="292" font-size="11" fill="#BFE6F5" opacity="0.75">VNet</text>

  <line x1="460" y1="272" x2="220" y2="304" stroke="#BFE6F5" marker-end="url(#arrow)"/>
  <line x1="460" y1="272" x2="520" y2="304" stroke="#BFE6F5" marker-end="url(#arrow)"/>

  <rect x="90" y="306" width="260" height="50" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="220" y="336" text-anchor="middle" font-size="13" fill="#BFE6F5">Subnet pública</text>

  <rect x="390" y="306" width="260" height="50" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="520" y="336" text-anchor="middle" font-size="13" fill="#BFE6F5">Subnet privada</text>

  <line x1="520" y1="356" x2="520" y2="384" stroke="#BFE6F5" marker-end="url(#arrow)"/>

  <rect x="400" y="386" width="240" height="56" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="520" y="410" text-anchor="middle" font-size="13" fill="#BFE6F5">AKS</text>
  <text x="520" y="427" text-anchor="middle" font-size="11" fill="#BFE6F5" opacity="0.75">node pool</text>

  <line x1="480" y1="442" x2="180" y2="558" stroke="#BFE6F5" marker-end="url(#arrow)"/>
  <line x1="520" y1="442" x2="390" y2="558" stroke="#BFE6F5" marker-end="url(#arrow)"/>
  <line x1="560" y1="442" x2="600" y2="558" stroke="#BFE6F5" marker-end="url(#arrow)"/>

  <rect x="90" y="560" width="180" height="54" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="180" y="592" text-anchor="middle" font-size="13" fill="#BFE6F5">Azure SQL</text>

  <rect x="300" y="560" width="180" height="54" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="390" y="592" text-anchor="middle" font-size="13" fill="#BFE6F5">Blob Storage</text>

  <rect x="510" y="560" width="180" height="54" rx="4" fill="none" stroke="#BFE6F5"/>
  <text x="600" y="592" text-anchor="middle" font-size="13" fill="#BFE6F5">Cosmos DB</text>

  <line x1="680" y1="328" x2="728" y2="328" style="stroke:#F0A93B" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="686" y="312" font-size="10.5" style="fill:#F0A93B">rota compartilhada</text>
  <text x="686" y="323" font-size="10.5" style="fill:#F0A93B">entre VNets</text>

  <rect x="730" y="300" width="190" height="56" rx="4" fill="none" style="stroke:#F0A93B"/>
  <text x="825" y="322" text-anchor="middle" font-size="12.5" style="fill:#F0A93B">VNet Peering</text>
  <text x="825" y="339" text-anchor="middle" font-size="12.5" style="fill:#F0A93B">Hub</text>

  <line x1="825" y1="356" x2="825" y2="394" style="stroke:#F0A93B" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="730" y="396" width="190" height="60" rx="4" fill="none" style="stroke:#F0A93B"/>
  <text x="825" y="416" text-anchor="middle" font-size="11" style="fill:#F0A93B">Hub VNet</text>
  <text x="825" y="431" text-anchor="middle" font-size="10.5" style="fill:#F0A93B" opacity="0.9">outras VNets /</text>
  <text x="825" y="444" text-anchor="middle" font-size="10.5" style="fill:#F0A93B" opacity="0.9">on-premises</text>
</svg>
